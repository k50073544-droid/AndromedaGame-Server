<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Двери 2D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#030203;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8dcc6;user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:absolute;left:0;top:0;overflow:hidden;transform-origin:0 0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;filter:saturate(.7) sepia(.12) brightness(.97)}
#vig{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 42%,rgba(0,0,0,.66) 100%)}
.ui{position:absolute;z-index:5}
.card{background:linear-gradient(180deg,rgba(22,17,13,.9),rgba(10,8,6,.92));border:1px solid rgba(170,140,90,.32);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.6)}
#hudL{top:10px;left:10px;padding:5px 10px;font-size:12px;font-weight:800;display:flex;gap:8px;align-items:center;pointer-events:none}
#hudL .g{color:#e9c35a}#hudL .b{color:#8ab8e8}
#hudL .tk{font-size:10px;font-weight:700;color:#bba57a;opacity:.85}
#plate{top:10px;left:50%;transform:translateX(-50%);padding:4px 14px;font-family:Georgia,"Times New Roman",serif;font-size:13px;font-weight:700;letter-spacing:3px;color:#d8bd7c;background:linear-gradient(180deg,#3d2c16,#1d150a);border:1px solid #8c7038;border-radius:4px;box-shadow:0 3px 10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,236,180,.2);pointer-events:none;white-space:nowrap}
#tut{top:44px;left:50%;transform:translateX(-50%);width:min(420px,62%);padding:8px 12px;font-size:13px;line-height:1.35;display:none;pointer-events:none}
#tut.on{display:block}
#tut .st{font-size:10px;letter-spacing:1.5px;color:#bda068;font-weight:800;margin-bottom:3px;display:flex;justify-content:space-between}
#tut b{color:#f0d79a}
#tut .bar{height:3px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:6px;overflow:hidden}
#tut .bar i{display:block;height:100%;background:linear-gradient(90deg,#a8843e,#e8cf8a);width:0;transition:width .4s}
#toast{bottom:92px;left:50%;transform:translate(-50%,0);padding:7px 14px;font-size:13px;font-weight:700;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,-10px)}
#hotwrap{bottom:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
#hname{font-size:11px;font-weight:800;color:#e0c78a;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .3s;pointer-events:none;height:14px}
#hname.on{opacity:1}
#hotbar{display:flex;gap:5px;align-items:flex-end;padding:5px;border-radius:12px;background:rgba(6,5,4,.6);border:1px solid rgba(170,140,90,.2)}
.slot{width:48px;height:48px;border-radius:9px;border:2px solid transparent;background:radial-gradient(circle at 50% 30%,#2c2118,#110c08) padding-box,linear-gradient(160deg,#a8854a,#4a3416 45%,#22170a 70%,#7a5c2c) border-box;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:inset 0 3px 7px rgba(0,0,0,.8),0 2px 5px rgba(0,0,0,.6)}
.slot.sel{background:radial-gradient(circle at 50% 30%,#3a2a1a,#140e09) padding-box,linear-gradient(160deg,#fff0c0,#e2bc6a 30%,#8a6428 65%,#f0d898) border-box;box-shadow:0 0 12px rgba(230,190,100,.5),inset 0 3px 7px rgba(0,0,0,.7)}
.slot canvas{width:38px;height:38px;pointer-events:none}
.slot .dur{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:2px;pointer-events:none}.slot .dur i{width:6px;height:3px;border-radius:2px;background:rgba(0,0,0,.6);box-shadow:inset 0 0 0 1px rgba(200,160,90,.35)}.slot .dur i.on{background:linear-gradient(#f2d48a,#b8862e)}
.slot .n{position:absolute;top:2px;left:5px;font-size:9px;color:rgba(230,210,170,.4);font-weight:800}
#bagBtn{width:46px;height:46px;border-radius:10px;border:2px solid transparent;background:radial-gradient(circle at 50% 30%,#3a2a1a,#140e09) padding-box,linear-gradient(160deg,#f0d898,#a8803c 35%,#3e280c 70%,#c9a35a) border-box;cursor:pointer;margin-left:3px;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.6)}
#bagBtn img,#admBtn img{width:30px;height:30px;display:block;pointer-events:none}
#bagBtn.flash{animation:fl 0.9s infinite}
@keyframes fl{50%{box-shadow:0 0 16px rgba(240,200,110,.9);border-color:#e8c46a}}
#inv{left:50%;bottom:86px;transform:translateX(-50%);padding:10px;display:none}
#inv.on{display:block}
#inv h4{margin:0 0 8px;font-size:12px;color:#e0c78a;display:flex;flex-direction:column;gap:2px;max-width:220px}
#inv h4 span{font-weight:500;color:rgba(255,255,255,.4);font-size:10px}
#invGrid{display:grid;grid-template-columns:repeat(4,48px);gap:5px}
#act{right:24px;bottom:24px;width:88px;height:88px;border-radius:50%;border:0;padding:0;color:#ecdcb8;display:none;align-items:center;justify-content:center;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;outline:none;background:radial-gradient(circle closest-side,#2b2017 0,#1a130d 62%,#0e0a07 77%,transparent 79%),conic-gradient(from 200deg,#4a3010,#f0d898 10%,#b08540 24%,#3e280c 46%,#7a5822 64%,#e2c27e 84%,#4a3010);box-shadow:0 8px 20px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.85);transition:transform .08s,opacity .25s}
#act::before{content:"";position:absolute;inset:10px;border-radius:50%;box-shadow:inset 0 4px 8px rgba(0,0,0,.85),inset 0 -1px 0 rgba(255,228,170,.16);pointer-events:none}
#act::after{content:"";position:absolute;left:20%;top:12%;width:44%;height:15%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,248,225,.16),rgba(255,248,225,0));transform:rotate(-20deg);pointer-events:none}
#act .ic{width:40px;height:40px;line-height:0;position:relative;transition:filter .2s}
#act .ic img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
#act:active{transform:scale(.93)}
#act.dim{opacity:.55}
#act.dim .ic{filter:saturate(.5) brightness(.7)}
#act .glow{position:absolute;inset:-5px;border-radius:50%;box-shadow:0 0 22px 5px rgba(240,190,100,.5);opacity:0;pointer-events:none;transition:opacity .25s}
#act.hot .glow{opacity:1;animation:actHot 1.8s ease-in-out infinite}
#act.hot .ic{filter:drop-shadow(0 0 6px rgba(255,190,90,.7))}
@keyframes actHot{0%,100%{opacity:.35}50%{opacity:1}}
#actCap{right:68px;bottom:122px;display:none;padding:5px 11px 4px;font:700 10px/1.2 Georgia,"Times New Roman",serif;letter-spacing:1.4px;text-transform:uppercase;color:#f0dca8;background:linear-gradient(180deg,rgba(42,30,17,.94),rgba(17,11,6,.94));border:1px solid rgba(196,154,82,.6);border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,230,170,.12);pointer-events:none;white-space:nowrap;opacity:0;transform:translate(50%,5px);transition:opacity .18s,transform .18s}
#actCap.on{opacity:1;transform:translate(50%,0)}
#actCap.no{color:#d2aea4;border-color:rgba(170,95,80,.55)}
#joy{left:0;top:0;bottom:0;width:45%;display:none;touch-action:none}
#joyCv{position:absolute;left:0;top:0;pointer-events:none}
#pcHelp{bottom:12px;left:12px;font-size:11px;color:rgba(240,225,200,.55);line-height:1.6;display:none;pointer-events:none;padding:6px 10px;transition:opacity 1s}
#pcHelp b{color:#e0c78a}
#admBtn,#adm{z-index:8}
#admBtn{top:8px;right:8px;width:38px;height:38px;border-radius:10px;display:none;cursor:pointer;padding:0;align-items:center;justify-content:center;border:2px solid transparent;background:radial-gradient(circle at 50% 30%,#2c2118,#110c08) padding-box,linear-gradient(160deg,#c9a35a,#4a3416 50%,#8a6428) border-box}

#adm{top:50px;right:8px;width:250px;max-height:calc(100% - 64px);overflow:auto;padding:10px;display:none;font-size:12px}

#adm h5{margin:8px 0 5px;font-size:10px;letter-spacing:1.4px;color:#bda068}

#over,#menu{inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:9px;text-align:center;padding:16px}
#over{background:radial-gradient(circle,rgba(20,14,8,.78),rgba(3,2,2,.94))}
#over.on,#menu.on{display:flex}
#over h2{margin:0;font-family:Georgia,serif;font-size:24px;color:#e0c78a;letter-spacing:1px;font-weight:400}
#over p{margin:0;font-size:13px;color:rgba(255,255,255,.7)}
#menu{background:radial-gradient(ellipse at 50% 45%,rgba(30,20,10,.25),rgba(2,1,1,.92) 72%)}
#logo{font-family:Georgia,"Times New Roman",serif;font-size:58px;font-weight:400;letter-spacing:14px;color:#d8bd7c;text-shadow:0 0 22px rgba(255,170,60,.25),0 2px 0 #1a1208;animation:flick 6s infinite;margin-right:-14px}
@keyframes flick{0%,100%{opacity:1}46%{opacity:1}47%{opacity:.35}48%{opacity:.9}49%{opacity:.4}50%{opacity:1}78%{opacity:.85}79%{opacity:1}}
#sub{font-size:11px;letter-spacing:5px;color:rgba(220,200,160,.5);margin-top:-6px}
.bigbtn{min-width:230px;padding:11px 22px;border-radius:8px;border:1px solid #8c7038;background:linear-gradient(180deg,#33240f,#170f06);color:#f0e2c2;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,236,180,.15);letter-spacing:.5px}
.bigbtn.alt{background:linear-gradient(180deg,#1d1710,#0d0a06);border-color:#4e3c22;color:#cdbb98}
.bigbtn .rec{display:block;font-size:10px;font-weight:600;color:#d8b860;margin-top:2px;letter-spacing:0}
#menuNote{font-size:11px;color:rgba(255,255,255,.4);max-width:360px;line-height:1.5}
#load{inset:0;display:flex;align-items:center;justify-content:center;background:#030203;font-size:12px;color:rgba(220,200,160,.55);flex-direction:column;gap:6px;letter-spacing:3px}
@media (max-height:460px){
 .slot{width:42px;height:42px}.slot canvas{width:33px;height:33px}#bagBtn{width:40px;height:40px}#bagBtn img{width:26px;height:26px}
 #invGrid{grid-template-columns:repeat(4,42px)}#inv{bottom:72px}
 #act{width:78px;height:78px;right:16px;bottom:16px}#act .ic{width:36px;height:36px}#actCap{right:55px;bottom:102px;font-size:9px}
 #tut{width:min(380px,50%);font-size:12px;padding:6px 10px;top:40px}#toast{bottom:78px}
 #logo{font-size:44px}.bigbtn{padding:9px 20px;font-size:14px}
}
body.inmenu #hotwrap,body.inmenu #act,body.inmenu #actCap,body.inmenu #joy,body.inmenu #hudL,body.inmenu #pcHelp,body.inmenu #inv{display:none!important}
</style></head><body>
<div id="stage">
<canvas id="cv"></canvas><div id="vig"></div>
<div id="hudL" class="ui card"><span class="g" id="hG">✨ 0</span><span class="b" id="hB">★ 0</span><span class="tk" id="hT"></span></div>
<div id="plate" class="ui">ОТЕЛЬ</div>
<div id="tut" class="ui card"><div class="st"><span>ОБУЧЕНИЕ</span><span id="tutN">1/11</span></div><div id="tutTx"></div><div class="bar"><i id="tutBar"></i></div></div>
<div id="toast" class="ui card"></div>
<div id="joy" class="ui"><canvas id="joyCv"></canvas></div>
<button id="act" class="ui" type="button"><span class="glow"></span><span class="ic"></span></button><div id="actCap" class="ui"></div>
<div id="inv" class="ui card"><h4>🎒 Рюкзак <span>нажми на вещь — она поменяется местами с выбранным слотом</span></h4><div id="invGrid"></div></div>
<div id="hotwrap" class="ui"><div id="hname"></div><div id="hotbar"></div></div>
<div id="pcHelp" class="ui card"><b>WASD</b> / стрелки — ходьба · <b>E</b> — действие<br><b>1–4</b> — слоты · <b>Tab</b> — рюкзак</div>
<button id="admBtn" class="ui" type="button" title="Админ-панель (F2)"></button>
<div id="adm" class="ui card"></div>
<div id="over" class="ui"><h2 id="overT">Комната пройдена</h2><p id="overP"></p><button class="bigbtn" id="overBtn" type="button">Сыграть ещё раз</button><button class="bigbtn alt" id="overMenu" type="button">В меню</button></div>
<div id="menu" class="ui"><div id="logo">ДВЕРИ</div><div id="sub">ОТЕЛЬ ИЗВИЛИНЫ</div><div style="height:12px"></div>
<button class="bigbtn" id="mTut" type="button">Обучение<span class="rec" id="mTutRec">рекомендуем начать отсюда</span></button>
<button class="bigbtn alt" id="mPlay" type="button">Тестовая комната</button>
<div id="menuNote"></div></div>

</div>
<script>
(function(){
'use strict';
const stage=document.getElementById('stage'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints>0)||matchMedia('(pointer:coarse)').matches;
const T=48,R=2,TR=T*R,CAPF=0.22;
let W=0,H=0,DPR=1,ZOOM=1.2,ROT=false;
/* ---------- горизонтальная игра: на телефоне в портрете сцену поворачиваем боком ---------- */
let dprCap=TOUCH?1.5:2;
function resize(){
  const iw=innerWidth,ih=innerHeight;ROT=TOUCH&&ih>iw;
  if(ROT){W=ih;H=iw;stage.style.width=W+'px';stage.style.height=H+'px';stage.style.transform='translate(0px,'+ih+'px) rotate(-90deg)';}
  else{W=iw;H=ih;stage.style.width=W+'px';stage.style.height=H+'px';stage.style.transform='none';}
  DPR=Math.min(dprCap,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ZOOM=Math.max(0.8,Math.min(1.8,Math.min(W/(T*10.5),H/(T*6.4))));
}
function toLocal(cx,cy){return ROT?[innerHeight-cy,cx]:[cx,cy];}
addEventListener('resize',resize);resize();
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};

/* ================= звук ================= */
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay){const a=ac();if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol||0.08,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.03);}
function noise(dur,vol,freq,delay,q){const a=ac();if(!a)return;const t=a.currentTime+(delay||0),n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=freq||900;f.Q.value=q||1;g.gain.setValueAtTime(vol||0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);}
const SND={
  pick(){tone(520,780,0.08,'triangle',0.05);tone(780,1040,0.07,'triangle',0.04,0.06);},
  star(g){tone(g?880:740,g?1760:1480,0.14,'sine',0.07);tone(g?1320:1110,g?2200:1660,0.12,'sine',0.045,0.09);tone(g?1760:1480,g?2640:1980,0.1,'sine',0.025,0.17);},
  creak(){tone(170,120,0.45,'triangle',0.02);},
  hit(){noise(0.08,0.1,420,0,0.7);tone(120,70,0.12,'sine',0.05);},
  brk(){noise(0.3,0.1,650,0,0.7);tone(95,50,0.28,'sine',0.05);noise(0.18,0.04,1600,0.06,1.2);},
  deny(){tone(220,180,0.14,'triangle',0.04);tone(180,140,0.16,'triangle',0.035,0.11);},
  hide(){tone(240,170,0.22,'triangle',0.035);tone(170,130,0.2,'sine',0.03,0.1);},
  unlock(){tone(520,760,0.08,'triangle',0.05);tone(760,1020,0.1,'triangle',0.045,0.08);},
  step(){},
  done(){[392,494,587,784].forEach((f,i)=>tone(f,f*1.01,0.22,'triangle',0.05,i*0.1));},
  chime(){tone(988,988,0.25,'sine',0.03);tone(1318,1318,0.3,'sine',0.022,0.12);}
};
function startHum(){ac();}

/* ================= случайность ================= */
let seed=1;function srand(s){seed=(Math.floor(Math.abs(s))%2147483646)+1;}function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
srand(Date.now());

/* ================= текстуры (шум + тёмная гамма, как в отеле из Doors) ================= */
function mkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function grain(g,w,h,amt,s){const id=g.getImageData(0,0,w,h),d=id.data;srand(s||1);for(let i=0;i<d.length;i+=4){const n=(rnd()-0.5)*amt;d[i]=Math.max(0,Math.min(255,d[i]+n));d[i+1]=Math.max(0,Math.min(255,d[i+1]+n*0.95));d[i+2]=Math.max(0,Math.min(255,d[i+2]+n*0.85));}g.putImageData(id,0,0);}
const TILE={floor:[],cap:null,face:[],ao:{},grainC:null,wainOnly:null};
(function buildTiles(){
  const woods=['#3a2416','#41291a','#352113','#3e2717','#33200f'];
  for(let v=0;v<4;v++){
    const c=mkC(TR,TR),g=c.getContext('2d');srand(91+v*17);
    const ph=TR/5;
    for(let i=0;i<5;i++){
      const y=i*ph,off=Math.floor(rnd()*TR);
      for(let k=-1;k<2;k++){
        const x=off+k*TR;
        const col=woods[Math.floor(rnd()*woods.length)];g.fillStyle=col;g.fillRect(x,y,TR,ph);
        for(let s=0;s<6;s++){g.strokeStyle='rgba(15,8,3,'+(0.18+rnd()*0.2)+')';g.lineWidth=0.6+rnd()*0.8;g.beginPath();const yy=y+2+rnd()*(ph-4);g.moveTo(x,yy);
          for(let xx=x;xx<=x+TR;xx+=12)g.lineTo(xx,yy+Math.sin(xx*0.05+s)*1.2);g.stroke();}
        if(rnd()<0.4){g.fillStyle='rgba(10,5,2,0.35)';g.beginPath();g.ellipse(x+rnd()*TR,y+ph/2,4+rnd()*3,1.6,0,0,Math.PI*2);g.fill();}
        g.fillStyle='rgba(255,210,150,0.045)';g.fillRect(x,y+1,TR,1.5);
        g.fillStyle='rgba(5,2,0,0.75)';g.fillRect(x+TR-1.2,y,1.2,ph);
      }
      g.fillStyle='rgba(5,2,0,0.8)';g.fillRect(0,y+ph-1.5,TR,1.5);
    }
    grain(g,TR,TR,6,v*7+3);
    const gl=g.createLinearGradient(0,0,TR,TR);gl.addColorStop(0,'rgba(255,230,190,0.05)');gl.addColorStop(0.5,'rgba(0,0,0,0)');gl.addColorStop(1,'rgba(0,0,0,0.05)');g.fillStyle=gl;g.fillRect(0,0,TR,TR);
    TILE.floor.push(c);
  }
  {const c=mkC(TR,TR),g=c.getContext('2d');g.fillStyle='#120d0b';g.fillRect(0,0,TR,TR);grain(g,TR,TR,4,5);TILE.cap=c;}
  for(let v=0;v<2;v++){
    const c=mkC(TR,TR),g=c.getContext('2d');
    const cap=Math.round(TR*CAPF);
    g.fillStyle='#120d0b';g.fillRect(0,0,TR,cap);

  const gr=bg.createLinearGradient(0,8,0,90);pal.stops.forEach(s=>gr.addColorStop(s[0],s[1]));bg.fillStyle=gr;bg.fillRect(0,0,S,S);

  o.drawImage(body,0,0);
  return out.toDataURL();
}

/* ---------- комнаты-регионы: свет из соседней комнаты виден, только когда дверь открыта ---------- */
function computeRegions(){
  const id=[];for(let y=0;y<M.h;y++)id.push(new Array(M.w).fill(-1));
  const pass=(x,y)=>{if(x<0||y<0||x>=M.w||y>=M.h)return false;const c=M.g[y][x];if(c==='.')return true;if(c==='D'){const d=doorAt(x,y);return !!d&&(d.st==='broken'||d.sw>0.3);}return false;};
  let n=0;for(let y=0;y<M.h;y++)for(let x=0;x<M.w;x++){if(id[y][x]!==-1||!pass(x,y))continue;const q=[[x,y]];id[y][x]=n;
    while(q.length){const [cx,cy]=q.pop();[[1,0],[-1,0],[0,1],[0,-1]].forEach(o=>{const nx=cx+o[0],ny=cy+o[1];if(pass(nx,ny)&&id[ny][nx]===-1){id[ny][nx]=n;q.push([nx,ny]);}});}n++;}
  M.reg=id;M.lights.forEach(l=>{l.reg=regionAt(l.px,l.py);});
}
function regionAt(wx,wy){const tx=Math.floor(wx/T),ty=Math.floor(wy/T);return M.reg&&M.reg[ty]&&M.reg[ty][tx]!=null?M.reg[ty][tx]:-1;}

/* ================= коллизии ================= */
function doorAt(x,y){for(const d of M.doors)if(d.x===x&&d.y===y)return d;return null;}
function doorPass(d){return d.st==='broken'||((d.st==='free'||d.st==='unlocked')&&d.sw>0.55);}
function solidTile(tx,ty){
  if(tx<0||ty<0||tx>=M.w||ty>=M.h)return true;
  const c=M.g[ty][tx];if(c==='.')return false;
  if(c==='D'){const d=doorAt(tx,ty);return !(d&&doorPass(d));}
  return true;
}
function hitsRect(x,y,r,o){const cx=Math.max(o.x,Math.min(x,o.x+o.w)),cy=Math.max(o.y,Math.min(y,o.y+o.h));return (x-cx)*(x-cx)+(y-cy)*(y-cy)<r*r;}
function blocked(x,y,r){
  if(ADM.noclip)return false;
  const x0=Math.floor((x-r)/T),x1=Math.floor((x+r)/T),y0=Math.floor((y-r)/T),y1=Math.floor((y+r)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solidTile(tx,ty)&&hitsRect(x,y,r,{x:tx*T,y:ty*T,w:T,h:T}))return true;
  for(const f of M.furn)if(hitsRect(x,y,r,f))return true;
  return false;
}

/* ================= тени: свет не проходит сквозь стены и закрытые двери ================= */
function occ(x,y,part){
  if(x<0||y<0||x>=M.w||y>=M.h)return true;
  const c=M.g[y][x];if(c==='.')return false;
  if(c==='D'){const d=doorAt(x,y),open=d&&(d.st==='broken'||d.sw>0.3);
    if(d&&d.o==='n')return open?false:part===0;if(d&&d.o==='v')return false;return !open;}
  if(y+1<M.h&&M.g[y+1][x]==='.')return part===0;
  return true;
}
function doorSig(){return M.doors.map(d=>(d.st==='broken'||d.sw>0.3)?1:0).join('');}
function buildSegs(){
  const segs=[],ys=y=>[y*T,y*T+CAPF*T,(y+1)*T];
  // горизонтальные границы
  for(let y=-1;y<M.h;y++)for(let part=0;part<2;part++){
    const ya=part===0?y:y,pa=part,yb=part===0?y:y+1,pb=part===0?1:0;
    const Y=part===0?y*T+CAPF*T:(y+1)*T;let run0=null;
    for(let x=0;x<=M.w;x++){const a=x<M.w?occ(x,ya,pa):false,b=x<M.w?occ(x,yb,pb):false,edge=x<M.w&&a!==b;
      if(edge&&run0===null)run0=x;if(!edge&&run0!==null){segs.push([run0*T,Y,x*T,Y]);run0=null;}}
  }
  // вертикальные границы
  for(let x=-1;x<M.w;x++){let run0=null,runY=0;
    const cells=[];for(let y=0;y<M.h;y++){cells.push([y,0,y*T,y*T+CAPF*T]);cells.push([y,1,y*T+CAPF*T,(y+1)*T]);}
    for(let i=0;i<=cells.length;i++){const c=cells[i];let edge=false;if(c){edge=occ(x,c[0],c[1])!==occ(x+1,c[0],c[1]);}
      if(edge&&run0===null)run0=c[2];if(!edge&&run0!==null){segs.push([(x+1)*T,run0,(x+1)*T,cells[i-1][3]]);run0=null;}}
  }
  M.doors.forEach(d=>{if(d.o==='v'&&!(d.st==='broken'||d.sw>0.3)){const cx=d.x*T+T/2;segs.push([cx,d.y*T,cx,(d.y+1)*T]);}});
  return segs;
}
function getSegs(){const s=doorSig();if(M.segV!==s){M.segV=s;M.segs=buildSegs();M.lights.forEach(l=>l.poly=null);computeRegions();}return M.segs;}
function visPoly(lx,ly,Rr){
  const segs=getSegs(),near=[];
  const x0=lx-Rr,x1=lx+Rr,y0=ly-Rr,y1=ly+Rr;
  for(const s of segs){if(Math.max(s[0],s[2])<x0||Math.min(s[0],s[2])>x1||Math.max(s[1],s[3])<y0||Math.min(s[1],s[3])>y1)continue;near.push(s);}
  near.push([x0,y0,x1,y0],[x1,y0,x1,y1],[x1,y1,x0,y1],[x0,y1,x0,y0]);
  const angs=[];
  for(const s of near){for(const p of [[s[0],s[1]],[s[2],s[3]]]){const a=Math.atan2(p[1]-ly,p[0]-lx);angs.push(a-0.0004,a,a+0.0004);}}
  const pts=[];
  for(const a of angs){const dx=Math.cos(a),dy=Math.sin(a);let best=Infinity;
    for(const s of near){const sx=s[2]-s[0],sy=s[3]-s[1],den=dx*sy-dy*sx;if(Math.abs(den)<1e-9)continue;
      const tt=((s[0]-lx)*sy-(s[1]-ly)*sx)/den,u=((s[0]-lx)*dy-(s[1]-ly)*dx)/den;if(tt>0&&u>=-1e-6&&u<=1+1e-6&&tt<best)best=tt;}
    if(best<Infinity)pts.push([a,lx+dx*best,ly+dy*best]);}
  pts.sort((p,q)=>p[0]-q[0]);
  return pts;
}

  for(let pass=0;pass<2;pass++){g.fillStyle=pass?col:IZC.furDD;g.globalAlpha=pass?1:0.4;
  for(let i=0;i<n;i++){
    const a=a0+(a1-a0)*(i+izR()*0.8)/n,ca=Math.cos(a),sa=Math.sin(a);
    let px=ca*rx,py=sa*ry,nx=ca/rx,ny=sa/ry;const nl=Math.hypot(nx,ny);nx/=nl;ny/=nl;
    const bx=cx+px*cr-py*sr,by=cy+px*sr+py*cr;const nx2=nx*cr-ny*sr,ny2=nx*sr+ny*cr;nx=nx2;ny=ny2;
    if(down){nx=nx*0.6;ny=ny*0.6+0.55;const l=Math.hypot(nx,ny);nx/=l;ny/=l;}
    const L=len*(0.5+izR()*0.5)*(pass?0.8:1),w=1.7+izR()*1.0,bend=(izR()-0.5)*1.4;
    izTuft(g,bx-nx*1.2,by-ny*1.2,nx,ny,L+1.2,w,bend);
  }}
  g.globalAlpha=1;
}
/* фактура меха внутри */
function izTex(g,cx,cy,rx,ry,n,col,seed,lw){
  izSeed(seed);g.strokeStyle=col;g.lineWidth=lw||0.45;g.lineCap='round';
  for(let i=0;i<n;i++){const a=izR()*Math.PI*2,r=Math.sqrt(izR())*0.85,x=cx+Math.cos(a)*rx*r,y=cy+Math.sin(a)*ry*r,an=Math.PI/2+(x-cx)/rx*0.7+(izR()-0.5)*0.5,L=1.4+izR()*1.8;

}
/* объём: свет сверху-слева, тень снизу-справа, тёплый ободок от усиков */

/* часть тела: заливка + пушистый край + фактура + объём */

  izStrands(g,cx,cy,rx,ry,opt.a0==null?0:opt.a0,opt.a1==null?Math.PI*2:opt.a1,opt.n||Math.round((rx+ry)*1.6),opt.len||2.6,colEdge||col,seed,opt.rot,opt.down);

function izTailShape(g,dir,sway,k){
  g.save();g.rotate(sway*dir);g.scale(k||1,k||1);
  const N=26,pts=[];
  const B=s=>{const u=1-s,p=[[0,0],[dir*17,-4],[dir*25,-30],[dir*9,-45]];return[u*u*u*p[0][0]+3*u*u*s*p[1][0]+3*u*s*s*p[2][0]+s*s*s*p[3][0],u*u*u*p[0][1]+3*u*u*s*p[1][1]+3*u*s*s*p[2][1]+s*s*s*p[3][1]];};
  for(let i=0;i<=N;i++){const s=i/N,a=B(Math.max(0,s-0.01)),b=B(Math.min(1,s+0.01)),c=B(s);let tx=b[0]-a[0],ty=b[1]-a[1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
    const w=s<0.1?3+s/0.1*4:(s<0.82?7+Math.sin((s-0.1)/0.72*Math.PI)*4.6:7-(s-0.82)/0.18*4.5);pts.push({x:c[0],y:c[1],tx,ty,nx:-ty,ny:tx,w,s});}
  const poly=k2=>{g.beginPath();pts.forEach((p,i)=>{const x=p.x+p.nx*p.w*k2,y=p.y+p.ny*p.w*k2;i?g.lineTo(x,y):g.moveTo(x,y);});for(let i=pts.length-1;i>=0;i--){const p=pts[i];g.lineTo(p.x-p.nx*p.w*k2,p.y-p.ny*p.w*k2);}g.closePath();};
  /* сторона, на которую падает свет (сверху-слева) */
  const lit=sd=>{const p=pts[N>>1];return (p.nx*sd*-0.6+p.ny*sd*-0.8)>0;};
  const clump=(p,sd,L,w,fw,col)=>{const dx=p.nx*sd*0.78+p.tx*0.62,dy=p.ny*sd*0.78+p.ty*0.62,dl=Math.hypot(dx,dy);
    const bx=p.x+p.nx*sd*p.w*0.2,by=p.y+p.ny*sd*p.w*0.2;g.fillStyle=col;izTuft(g,bx,by,dx/dl,dy/dl,L,w,fw*sd);};
  poly(0.8);g.fillStyle=IZC.furD;g.fill();
  izSeed(31);
  /* нижний тёмный слой */
  for(let i=1;i<N;i++){const p=pts[i];[-1,1].forEach(sd=>{clump(p,sd,p.w*(0.95+izR()*0.3),3.0+izR()*1.2,(izR()-0.5)*2,lit(sd)?IZC.furD:IZC.furDD);});}
  /* основной слой */
  for(let i=1;i<N;i++){const p=pts[i];[-1,1].forEach(sd=>{clump(p,sd,p.w*(0.75+izR()*0.25),2.8+izR()*1.0,(izR()-0.5)*1.6,lit(sd)?IZC.fur:IZC.furM);});}
  /* светлые пряди на освещённой стороне */
  for(let i=2;i<N;i+=1){const p=pts[i];[-1,1].forEach(sd=>{if(!lit(sd))return;g.globalAlpha=0.55;clump(p,sd,p.w*(0.5+izR()*0.3),2.0+izR()*0.8,(izR()-0.5)*1.2,IZC.furL);g.globalAlpha=1;});}
  /* центральный хребет — тень */
  g.strokeStyle='rgba(8,36,40,0.35)';g.lineWidth=1.2;g.lineCap='round';g.beginPath();pts.forEach((p,i)=>{i<N-1&&(i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));});g.stroke();
  /* тонкие волоски */
  g.strokeStyle='rgba(200,245,235,0.28)';g.lineWidth=0.4;
  for(let i=2;i<N-1;i++){const p=pts[i];const sd=izR()<0.5?-1:1;const r=izR()*0.7;const x=p.x+p.nx*sd*p.w*r,y=p.y+p.ny*sd*p.w*r;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+p.tx*2+p.nx*sd*1.5,y+p.ty*2+p.ny*sd*1.5,x+p.tx*3.6+p.nx*sd*3,y+p.ty*3.6+p.ny*sd*3);g.stroke();}
  /* тёмная кисточка на конце */
  for(let i=N-5;i<=N;i++){const p=pts[i];const f=(i-(N-5))/5;[-1,1].forEach(sd=>{g.fillStyle=IZC.tip;g.globalAlpha=0.35+f*0.65;clump(p,sd,p.w*0.9+2+f*2,1.8+f,(izR()-0.5)*1.4,IZC.tip);});}
  g.globalAlpha=1;const e=pts[N];g.fillStyle=IZC.tip;g.beginPath();g.moveTo(e.x-e.nx*2.5,e.y-e.ny*2.5);g.quadraticCurveTo(e.x+e.tx*6,e.y+e.ty*6,e.x+e.nx*2.5,e.y+e.ny*2.5);g.fill();

  g.fillStyle=gold?'#5a3606':'#0a1840';star5(g,R+0.9,ri+0.5);g.fill();
  const L=[-0.55,-0.95];/* свет сверху-слева */
  for(let i=0;i<10;i++){const p=P[i],q=P[(i+1)%10];const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,ml=Math.hypot(mx,my)||1;let d=(mx/ml)*L[0]+(my/ml)*L[1];d=d*Math.cos(spin)+0.15;
    const tone=d>0.35?0:(d>-0.25?1:2),c=C[tone];const gr=g.createLinearGradient(0,0,mx,my);gr.addColorStop(0,c[0]);gr.addColorStop(1,c[1]);g.fillStyle=gr;
    g.beginPath();g.moveTo(0,0);g.lineTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.closePath();g.fill();}
  g.strokeStyle=gold?'rgba(255,240,190,0.45)':'rgba(220,240,255,0.45)';g.lineWidth=0.35;for(let i=0;i<10;i+=2){g.beginPath();g.moveTo(0,0);g.lineTo(P[i][0],P[i][1]);g.stroke();}

}
